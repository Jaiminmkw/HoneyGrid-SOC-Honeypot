<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Cyber Attack Dashboard</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
      border-left: 5px solid #38bdf8;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .card h3 {
      margin-top: 0;
      font-size: 14px;
      color: #94a3b8;
    }
    .card .value {
      font-size: 28px;
      font-weight: bold;
    }
    .live-capture-feed {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      height: 350px;
      overflow-y: auto;
      font-family: monospace;
    }
    .feed-item {
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 4px;
      font-size: 13px;
      border-left: 4px solid #38bdf8;
    }
    .danger {
      background-color: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .warning {
      background-color: rgba(245, 158, 11, 0.15);
      border-color: #f59e0b;
      color: #fde68a;
    }
  </style>
</head>
<body>

  <h1>🛡️ SOC Security Operations Center</h1>

  <div class="grid">
    <div class="card" style="border-color: #ef4444;">
      <h3>CRITICAL DEAUTH ALERTS</h3>
      <div class="value" id="critical-alerts-count" style="color: #ef4444;">0</div>
    </div>
    <div class="card" style="border-color: #f59e0b;">
      <h3>ROGUE AP / BEACONS DETECTED</h3>
      <div class="value" id="rogue-ap-count" style="color: #f59e0b;">0</div>
    </div>
  </div>

  <h2>Live Capture Feed</h2>
  <div class="live-capture-feed"></div>

  <!-- Yahan JS file link ho rahi hai -->
  <script src="script 1.js"></script>
</body>
</html>
